name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deployment dependencies
        run: python -m pip install -e ".[desktop,deployment]"

      - name: Build bundled Python bridge
        run: >-
          python -m PyInstaller --onefile --name personal-agent-bridge
          --collect-all winpty --paths src --distpath frontend/src-tauri/resources
          --workpath .build/pyinstaller --specpath .build/pyinstaller
          --clean packaging/bridge_entry.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and publish Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: Personal Agent ${{ github.ref_name }}
          releaseBody: Windows 설치 파일입니다. Codex CLI 설치와 로그인이 필요합니다.
          releaseDraft: true
          prerelease: false
